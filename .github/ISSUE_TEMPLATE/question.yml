name: Usage question
description: Ask a question not answered by the documentation
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: Please check the README and docs first. Never include API keys, tokens, proxy credentials, real account/provider names, conversation content, or unredacted logs.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe what you are trying to accomplish and where you are blocked.
    validations:
      required: true
  - type: textarea
    id: checked
    attributes:
      label: Documentation checked
      description: List the README section, docs page, or command help you already read.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Include only non-sensitive versions and platform details.
  - type: checkboxes
    id: submission
    attributes:
      label: Submission checks
      options:
        - label: I removed all credentials and private data.
          required: true
        - label: This is not a security report or reproducible product bug.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
